<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      user-scalable=no и viewport-fit=cover обязательны для мини-приложения:
      случайный зум двумя пальцами ломает раскладку, а cover нужен, чтобы
      контент рисовался под вырезами экрана и мы сами управляли отступами.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Clots: Hem Empire</title>
    <meta
      name="description"
      content="Пошаговая стратегия о разумной крови, строящей империю в сосудистой сети: захват секторов, доктрины, иммунные рейды."
    />
    <meta name="theme-color" content="#150a0e" />
    <link rel="icon" type="image/svg+xml" href="./icons/drop.svg" />
    <link rel="apple-touch-icon" href="./icons/clots.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Clots: Hem Empire" />
    <meta property="og:type" content="website" />
    <!--
      SDK Telegram грузится только с telegram.org и не бандлится: Telegram
      обновляет его самостоятельно. Скрипт синхронный, чтобы window.Telegram
      существовал до старта приложения.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
